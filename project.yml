name: AutoAlignPanels
options:
  bundleIdPrefix: io.github.neuralfoundry-coder
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  AutoAlignPanelsCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/AutoAlignPanelsCore
    settings:
      base:
        PRODUCT_NAME: AutoAlignPanelsCore
  AutoAlignPanels:
    type: application
    platform: macOS
    sources:
      - Sources/AutoAlignPanels
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.neuralfoundry-coder.AutoAlignPanels
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_NAME: AutoAlignPanels
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: KeyboardShortcuts
      - target: AutoAlignPanelsCore
    entitlements:
      path: AutoAlignPanels.entitlements
      properties:
        com.apple.security.app-sandbox: true
  AutoAlignPanelsCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AutoAlignPanelsCoreTests
    dependencies:
      - target: AutoAlignPanelsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.neuralfoundry-coder.AutoAlignPanelsTests
schemes:
  AutoAlignPanels:
    build:
      targets:
        AutoAlignPanels: all
    test:
      targets:
        - AutoAlignPanelsCoreTests
